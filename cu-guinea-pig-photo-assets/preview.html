<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실제 기니피그 · CU 알바생 이미지</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e9;color:#3e2f4a;font:16px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:40px 20px}h1{font-size:clamp(24px,5vw,38px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border-radius:20px;overflow:hidden}.stage{height:300px;display:flex;align-items:center;justify-content:center;padding:14px;background:#faf9f6}.dark .stage{background:#292532}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.card p{padding:0 18px}button{padding:10px 18px;background:white;color:#583672;border:1px solid #ded5e5;border-radius:22px;margin:0 8px 22px 0;cursor:pointer}a{color:#694293}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.stage{height:260px}}@media(max-width:450px){.stage{height:210px}.grid{gap:10px}}</style><main><h1>사진 속 기니피그, CU 알바생이 되다</h1><p>위 가리키기 · 네발 걷기 · 성공 · 실패</p><button id="bg">어두운 배경</button><button id="toggle">걷기 정지</button><section class="grid"><article class="card"><div class="stage"><img src="point-up-640.webp" alt="앞발로 위를 가리키는 기니피그"></div><p>위를 가리켜요</p></article><article class="card"><div class="stage"><img id="walk" src="loading-still.webp" alt="오른쪽으로 네 발로 걷는 기니피그"></div><p>메뉴 고르는 중 · GIF</p></article><article class="card"><div class="stage"><img src="success-640.webp" alt="양 앞발을 들고 기뻐하는 기니피그"></div><p>성공했어요!</p></article><article class="card"><div class="stage"><img src="failure-640.webp" alt="고개를 숙인 기니피그"></div><p>다시 해볼까요</p></article></section><p><a href="loading-walk.gif" download>걷기 GIF 다운로드</a> · <a href="README.md">파일 설명</a></p></main><script>const w=document.querySelector('#walk'),b=document.querySelector('#toggle');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;function show(){w.src=paused?'loading-still.webp':'loading-walk.gif';b.textContent=paused?'걷기 재생':'걷기 정지';b.setAttribute('aria-pressed',String(paused))}show();b.onclick=()=>{paused=!paused;show()};document.querySelector('#bg').onclick=function(){let d=document.body.classList.toggle('dark');this.textContent=d?'밝은 배경':'어두운 배경';this.setAttribute('aria-pressed',String(d))}</script></html>
